name: booknaw
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  hugeicons: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo.png"
  color_dark: "#121212"
  image_dark: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#121212"

flutter:
  uses-material-design: true
  assets:
    - assets/
