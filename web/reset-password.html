<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Katalaluan | NACHOZYYY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #121212;
      color: white;
    }
    .card {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    h2 {
      color: #ff5722;
      margin-bottom: 8px;
    }
    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #ff5722;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #ff5722;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      background: #e64a19;
      transform: translateY(-2px);
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #message {
      margin-top: 20px;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
    .error { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 1px solid #f44336; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://wazeallszgpiasinsjzi.supabase.co/storage/v1/object/public/assets/logo.png" alt="Logo" style="width: 80px; margin-bottom: 16px; border-radius: 50%;">
    <h2>NACHOZYYY</h2>
    <p>Sila masukkan katalaluan baru anda di bawah.</p>
    
    <div class="input-group">
      <label for="new-password">Katalaluan Baru</label>
      <input type="password" id="new-password" placeholder="Min 6 aksara">
    </div>

    <div class="input-group">
      <label for="confirm-password">Sahkan Katalaluan</label>
      <input type="password" id="confirm-password" placeholder="Ulang katalaluan">
    </div>

    <button id="reset-btn" onclick="updatePassword()">Tukar Katalaluan</button>
    
    <div id="message"></div>
  </div>

  <script>
    const supabaseUrl = 'https://wazeallszgpiasinsjzi.supabase.co';
    const supabaseAnonKey = 'sb_publishable_0mYxWKXT0gnLwun9OmKzuQ_7qZSJmoh';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function updatePassword() {
      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const btn = document.getElementById('reset-btn');
      const msg = document.getElementById('message');

      if (password.length < 6) {
        showMessage("Katalaluan mestilah sekurang-kurangnya 6 aksara.", "error");
        return;
      }

      if (password !== confirm) {
        showMessage("Katalaluan tidak sepadan!", "error");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Sila tunggu...";

      const { data, error } = await supabaseClient.auth.updateUser({ password: password });
      
      if (error) {
        showMessage("Ralat: " + error.message, "error");
        btn.disabled = false;
        btn.innerText = "Tukar Katalaluan";
      } else {
        showMessage("Berjaya! Katalaluan anda telah dikemaskini. Sila log masuk semula di aplikasi NACHOZYYY.", "success");
        btn.style.display = "none";
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerText = text;
      msg.className = type;
      msg.style.display = "block";
    }
  </script>
</body>
</html>
